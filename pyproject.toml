[project]
name = "okta-mcp-server"
version = "0.1.0"
description = "Okta MCP Server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "fastmcp>=3.2.0",
    "okta>=2.9.13,<3.0.0",
    "requests>=2.32.4",
    "ruff>=0.11.13",
    "keyring>=25.6.0",
    "keyrings.alt>=5.0.0",
]

[tool.uv]
# Constrain setuptools in build environments so pkg_resources is available for flatdict
build-constraint-dependencies = ["setuptools<71"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/okta_mcp_server"]

[project.scripts]
okta-mcp-server = "okta_mcp_server:main"
