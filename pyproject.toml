[project]
name = "okta-mcp-server"
version = "0.1.0"
description = "Okta MCP Server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "fastmcp>=3.2.4",
    "okta>=3.4.2",
    "requests>=2.33.1",
    "keyring>=25.7.0",
    "keyrings.alt>=5.0.2",
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-exporter-otlp-proto-http>=1.43.0",
    "opentelemetry-instrumentation-aiohttp-client>=0.64b0",
    "opentelemetry-instrumentation-starlette>=0.64b0",
    "opentelemetry-instrumentation-httpx>=0.64b0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
    "ty>=0.0.33",
]

[tool.hatch.build.targets.wheel]
packages = ["src/okta_mcp_server"]

[project.scripts]
okta-mcp-server = "okta_mcp_server.server:main"

[tool.ty.environment]
extra-paths = ["stubs"]
